name: StudyEN
options:
  bundleIdPrefix: com.studyen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  StudyEN:
    type: application
    platform: iOS
    sources:
      - path: StudyEN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.studyen.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 语块
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要麦克风判定你是否真的开口说对了，达标才能打卡。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 用语音识别检查你的跟读和回想是否达标。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
